# 테스트 설정. build.gradle이 test 프로필을 켠다.
# 로컬에서는 H2(MariaDB 호환 모드), CI에서는 TEST_DB_URL로 MariaDB 컨테이너를 쓴다.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:dart_insight;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=LOW;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
    # 테스트는 설정이 다른 Spring 컨텍스트를 여러 개 캐시하고, 컨텍스트마다 연결 풀을 잡는다.
    # 기본 풀(10개)이면 CI MariaDB의 최대 연결 수를 넘어 'Too many connections'로 실패하므로 작게 둔다.
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0

app:
  # 여러 테스트가 같은 IP로 질문을 부르므로 한도는 끄고, 한도 테스트(LlmQuotaApiTest)에서만 켠다
  llm-quota:
    enabled: false
  password-reset:
    # 메일 처리를 응답 안에서 끝내 테스트가 바로 확인한다. 메일 설정은 비운다(테스트는 기록만 하는 가짜 발송기를 씀)
    async: false
    mail-host: ""
  ai-server:
    # 테스트는 AI 서버를 실제로 부르지 않는다(가짜 서버를 띄우거나, 연결이 바로 거절되는 주소)
    base-url: http://127.0.0.1:1
    internal-token: test-internal-token-that-is-at-least-32-chars
  data-go-kr:
    # 테스트는 공공데이터포털을 실제로 부르지 않는다(가짜 서버를 띄움)
    api-key: test-key-not-real
    base-url: http://127.0.0.1:1
  naver-search:
    # 테스트는 NAVER API HUB를 실제로 부르지 않는다(가짜 서버를 띄움)
    client-id: test-id-not-real
    client-secret: test-secret-not-real
    base-url: http://127.0.0.1:1
  featured:
    sync: never
  season-changes:
    # 시즌 순위는 테스트가 직접 계산을 부른다(스케줄로 돌지 않게)
    enabled: false
  opendart:
    # 테스트는 OpenDART를 실제로 부르지 않는다(가짜 서버를 띄우거나 저장된 데이터만 씀)
    api-key: test-key-not-real
    base-url: http://127.0.0.1:1
    corp-code-sync: never
  document:
    # 테스트용 원문 캐시. 테스트가 시작할 때 비운다
    cache-dir: build/test-document-cache
  analysis:
    # 분석을 요청 안에서 끝까지 돌려 결과를 바로 확인한다
    async: false
