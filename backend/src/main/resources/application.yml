spring:
  application:
    name: dart-insight-backend
  config:
    # backend/.env가 있으면 환경변수처럼 읽는다(.env는 커밋하지 않음)
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 로그마다 요청 추적 ID(X-Trace-Id)를 남긴다
    level: "%5p [%X{traceId:-}]"

app:
  ai-server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 30s
    # 연결 상태 확인은 짧게 기다린다
    health-timeout: 3s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
