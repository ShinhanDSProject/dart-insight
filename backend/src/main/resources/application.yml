spring:
  application:
    name: dart-insight-backend
  config:
    # backend/.env가 있으면 환경변수처럼 읽는다(.env는 커밋하지 않음)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/dart_insight}
    username: ${DB_USERNAME:dart}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾸고, 엔티티와 맞는지만 확인한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:development-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:development-google-secret}
            scope: openid,profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:development-kakao-client}
            client-secret: ${KAKAO_CLIENT_SECRET:development-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_CLIENT_ID:development-naver-client}
            client-secret: ${NAVER_CLIENT_SECRET:development-naver-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 로그마다 요청 추적 ID(X-Trace-Id)를 남긴다
    level: "%5p [%X{traceId:-}]"

app:
  auth:
    issuer: ${JWT_ISSUER:dart-insight}
    jwt-secret: ${JWT_SECRET:development-only-change-me-32-bytes}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    social-login-redirect-url: ${SOCIAL_LOGIN_REDIRECT_URL:http://localhost:5173/login}
    # 쉼표로 구분한 관리자 이메일(ADR-0040). 비어 있으면 아무도 관리자로 올리지 않는다
    admin-emails: ${ADMIN_EMAILS:}
  # 비밀번호 재설정(6.8, ADR-0055). MAIL_HOST가 비면 메일을 보내지 않는다. 로컬 개발은 PASSWORD_RESET_LOG_LINK=true로 링크를 로그에서 본다
  # Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=팀 계정, MAIL_PASSWORD=앱 비밀번호(노션 공용 키 모음·서버 환경변수에만)
  password-reset:
    page-url: ${PASSWORD_RESET_PAGE_URL:http://localhost:5173/password-reset}
    mail-host: ${MAIL_HOST:}
    mail-port: ${MAIL_PORT:587}
    mail-username: ${MAIL_USERNAME:}
    mail-password: ${MAIL_PASSWORD:}
    mail-from: ${MAIL_FROM:}
    # 메일 설정이 없을 때 링크를 로그에 남길지(로컬 개발 전용). 운영에서는 켜지 않는다
    log-link-without-mail: ${PASSWORD_RESET_LOG_LINK:false}
  ai-server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: 2s
    # 원문 구조화·문장 비교·요약은 오래 걸릴 수 있어 넉넉히 기다린다
    read-timeout: 180s
    # 연결 상태 확인은 짧게 기다린다
    health-timeout: 3s
    # 주요 사건은 ai-server 최악 1,140초(묶기 480 + 금액 240 + 문장 예산 300 + 예산 끝에 시작한 문장 호출 120)보다
    # 길게 기다린다(ADR-0060, ADR-0057의 900초를 대체)
    text-events-read-timeout: 1200s
  agent:
    # 채팅 한 번의 ai-server 왕복 상한과 전체 시간(ADR-0044). 이미 시작한 왕복은 끊지 않아 조금 넘을 수 있다
    max-steps: 5
    timeout: 60s
    # 한 Tool 결과를 줄여 보내는 크기(docs/api-spec.md 3절)
    max-items: 10
    max-result-chars: 4000
  # 질문·에이전트 채팅(ADR-0054)과 새 분석(ADR-0056)의 하루 LLM 호출 한도. 한국 시간 0시에 초기화, 서버 재시작해도 초기화
  llm-quota:
    enabled: ${LLM_QUOTA_ENABLED:true}
    anonymous-per-day: ${LLM_QUOTA_ANONYMOUS_PER_DAY:20}
    member-per-day: ${LLM_QUOTA_MEMBER_PER_DAY:100}
    total-per-day: ${LLM_QUOTA_TOTAL_PER_DAY:3000}
    # 사용자가 요청한 새 분석(재사용·비교 불가는 세지 않음, ADR-0056)
    analysis-anonymous-per-day: ${LLM_QUOTA_ANALYSIS_ANONYMOUS_PER_DAY:10}
    analysis-member-per-day: ${LLM_QUOTA_ANALYSIS_MEMBER_PER_DAY:30}
    analysis-total-per-day: ${LLM_QUOTA_ANALYSIS_TOTAL_PER_DAY:500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  data-go-kr:
    # 공공데이터포털 일반 인증키(ADR-0033). 포털 화면의 키를 그대로 넣는다(인코딩된 모양이어도 됨)
    api-key: ${DATA_GO_KR_API_KEY:}
    base-url: https://apis.data.go.kr
    connect-timeout: 5s
    read-timeout: 30s
  naver-search:
    # NAVER API HUB 뉴스 검색(ADR-0046). 네이버 클라우드 콘솔 NAVER API HUB 애플리케이션의 인증 정보
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
    base-url: https://naverapihub.apigw.ntruss.com
    connect-timeout: 3s
    read-timeout: 10s
    # 기업별 뉴스 목록을 메모리에 두는 시간
    cache-ttl: 30m
    # 하루에 네이버를 부르는 최대 횟수(로그인 없는 API라 공용 키 한도 25,000회를 지키려고 낮게 둠)
    daily-budget: 20000
  glossary:
    # 공시 용어 카드 파일(ADR-0061). 카드는 이 파일 한 곳에 두고, 출처·검토일이 있는 카드만 내보낸다
    location: classpath:glossary/terms.json
  featured:
    # 첫 화면 대표 기업(1.5): 시작할 때와 하루마다 오래됐으면 받음(on-stale), 받지 않음(never)
    sync: ${FEATURED_COMPANY_SYNC:on-stale}
    refresh-after: 30d
    check-interval: 1d
    limit: 100
  season-changes:
    # 이번 시즌 변화가 큰 기업(1.7, ADR-0037): 시작 뒤 첫 확인까지와 그 뒤 확인 간격. 계산한 시즌은 다시 계산하지 않음
    enabled: ${SEASON_CHANGES_ENABLED:true}
    first-check-delay: 2m
    check-interval: 1d
    # 제출 기한(분기·반기 45일, 사업보고서 90일)에서 이만큼 지나야 그 시즌을 계산
    grace-days: 7
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr
    connect-timeout: 5s
    read-timeout: 60s
    max-retries: 2
    # 기업 목록(corpCode.xml)을 시작할 때 받을지: on-empty(비어 있을 때만), always, never
    corp-code-sync: ${OPENDART_CORP_CODE_SYNC:on-empty}
  document:
    # 받은 원문 ZIP을 접수번호별로 두는 폴더(같은 원문을 OpenDART에서 다시 받지 않음). 커밋하지 않는다
    cache-dir: ${DOCUMENT_CACHE_DIR:./data/documents}
  analysis:
    # 분석을 요청과 다른 스레드에서 돌린다. 테스트는 false(요청 안에서 끝까지 실행)
    async: true
  text-events:
    # 주요 사건 만들기. 7.7 검증을 통과하기 전에는 꺼 둔다(ADR-0050)
    enabled: ${TEXT_EVENTS_ENABLED:false}
  company:
    # 기업개황(company.json)을 받은 지 이 시간이 지나면 다시 받는다(ADR-0024)
    overview-refresh-after: 7d
  reports:
    # 정기보고서 목록을 받은 지 이 시간이 지나면 다시 받는다(OpenDART 호출 한도)
    refresh-after: 24h
    # 즐겨찾기 기업은 refresh-after와 상관없이 이 주기마다 다시 받아 새 보고서를 찾는다(ADR-0027).
    # 한 회차에 즐겨찾기된 기업 수만큼 OpenDART를 부른다
    polling-interval: 6h
    # 이 해 1월 1일 이후 접수된 보고서만 받는다(재무제표 API는 2015년 이후만 제공)
    list-start-year: 2015
  disclosures:
    # 최근 공시 목록을 받은 지 이 시간이 지나면 다시 받는다(ADR-0024)
    refresh-after: 1h
  ai-usage:
    # AI 사용 현황의 추정 비용(FS-50). "제공자:모델"(llm_call.provider·model) → 100만 토큰당 USD.
    # 공식 가격 페이지 값만 넣고 추측하지 않는다. 없는 모델(가짜 제공자 fake 포함)은 비용이 null이다.
    prices:
      # OpenAI gpt-6.1-sol: 입력 2달러, 출력 10달러(2026-10-26 확인, ADR-0026)
      # 출처: https://developers.openai.com/api/docs/models/gpt-6.1-sol — 가격이 바뀌면 공식 페이지를 다시 확인한다
      "[openai:gpt-6.1-sol]":
        input-per-million-usd: 2
        output-per-million-usd: 10
      # OpenAI gpt-6-luna: 입력 0.1달러, 출력 0.5달러(2026-11-06 확인, ADR-0059 에이전트 Tool 고르기)
      # 출처: OpenAI 모델 페이지 가격(ADR-0059 맥락에 적은 값). 바뀌면 공식 페이지를 다시 확인한다
      "[openai:gpt-6-luna]":
        input-per-million-usd: 0.1
        output-per-million-usd: 0.5
      # Anthropic claude-sonnet-5-5: 입력 2달러, 출력 10달러(2026-11-09 확인, ADR-0062. 기본 모델은 ADR-0063부터 haiku)
      # 출처: Anthropic 가격 페이지(https://platform.claude.com/docs/en/about-claude/pricing). 바뀌면 다시 확인한다
      "[anthropic:claude-sonnet-5-5]":
        input-per-million-usd: 2
        output-per-million-usd: 10
      # Anthropic claude-sonnet-5: 입력 2달러, 출력 10달러(2026-11-09 확인, 출시 때의 안내가 표준 가격으로 확정).
      # claude-sonnet-5-5가 cyber·frontier_llm 분류로 거절하면 서버가 이 모델로 다시 돌린다(ADR-0062 거절 대체)
      "[anthropic:claude-sonnet-5]":
        input-per-million-usd: 2
        output-per-million-usd: 10
      # Anthropic claude-haiku-5-5: 입력 0.1달러, 출력 0.5달러(프롬프트 10만 토큰 이하, 2026-11-09 확인,
      # ADR-0063 기본 모델). 출처는 위와 같다
      "[anthropic:claude-haiku-5-5]":
        input-per-million-usd: 0.1
        output-per-million-usd: 0.5
