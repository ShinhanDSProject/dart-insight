spring:
  application:
    name: dart-insight-backend
  config:
    # backend/.env가 있으면 환경변수처럼 읽는다(.env는 커밋하지 않음)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/dart_insight}
    username: ${DB_USERNAME:dart}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾸고, 엔티티와 맞는지만 확인한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:development-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:development-google-secret}
            scope: openid,profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:development-kakao-client}
            client-secret: ${KAKAO_CLIENT_SECRET:development-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_CLIENT_ID:development-naver-client}
            client-secret: ${NAVER_CLIENT_SECRET:development-naver-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 로그마다 요청 추적 ID(X-Trace-Id)를 남긴다
    level: "%5p [%X{traceId:-}]"

app:
  auth:
    issuer: ${JWT_ISSUER:dart-insight}
    jwt-secret: ${JWT_SECRET:development-only-change-me-32-bytes}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    social-login-redirect-url: ${SOCIAL_LOGIN_REDIRECT_URL:http://localhost:5173/login}
  ai-server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: 2s
    # 원문 구조화·문장 비교·요약은 오래 걸릴 수 있어 넉넉히 기다린다
    read-timeout: 180s
    # 연결 상태 확인은 짧게 기다린다
    health-timeout: 3s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  data-go-kr:
    # 공공데이터포털 일반 인증키(ADR-0033). 포털 화면의 키를 그대로 넣는다(인코딩된 모양이어도 됨)
    api-key: ${DATA_GO_KR_API_KEY:}
    base-url: https://apis.data.go.kr
    connect-timeout: 5s
    read-timeout: 30s
  featured:
    # 첫 화면 대표 기업(1.5): 시작할 때와 하루마다 오래됐으면 받음(on-stale), 받지 않음(never)
    sync: ${FEATURED_COMPANY_SYNC:on-stale}
    refresh-after: 30d
    check-interval: 1d
    limit: 100
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr
    connect-timeout: 5s
    read-timeout: 60s
    max-retries: 2
    # 기업 목록(corpCode.xml)을 시작할 때 받을지: on-empty(비어 있을 때만), always, never
    corp-code-sync: ${OPENDART_CORP_CODE_SYNC:on-empty}
  document:
    # 받은 원문 ZIP을 접수번호별로 두는 폴더(같은 원문을 OpenDART에서 다시 받지 않음). 커밋하지 않는다
    cache-dir: ${DOCUMENT_CACHE_DIR:./data/documents}
  analysis:
    # 분석을 요청과 다른 스레드에서 돌린다. 테스트는 false(요청 안에서 끝까지 실행)
    async: true
  company:
    # 기업개황(company.json)을 받은 지 이 시간이 지나면 다시 받는다(ADR-0024)
    overview-refresh-after: 7d
  reports:
    # 정기보고서 목록을 받은 지 이 시간이 지나면 다시 받는다(OpenDART 호출 한도)
    refresh-after: 24h
    # 즐겨찾기 기업은 refresh-after와 상관없이 이 주기마다 다시 받아 새 보고서를 찾는다(ADR-0027).
    # 한 회차에 즐겨찾기된 기업 수만큼 OpenDART를 부른다
    polling-interval: 6h
    # 이 해 1월 1일 이후 접수된 보고서만 받는다(재무제표 API는 2015년 이후만 제공)
    list-start-year: 2015
  disclosures:
    # 최근 공시 목록을 받은 지 이 시간이 지나면 다시 받는다(ADR-0024)
    refresh-after: 1h
  ai-usage:
    # AI 사용 현황의 추정 비용(FS-50). "제공자:모델"(llm_call.provider·model) → 100만 토큰당 USD.
    # 공식 가격 페이지 값만 넣고 추측하지 않는다. 없는 모델(가짜 제공자 fake 포함)은 비용이 null이다.
    prices:
      # OpenAI gpt-6.1-sol: 입력 2달러, 출력 10달러(2026-10-26 확인, ADR-0026)
      # 출처: https://developers.openai.com/api/docs/models/gpt-6.1-sol — 가격이 바뀌면 공식 페이지를 다시 확인한다
      "[openai:gpt-6.1-sol]":
        input-per-million-usd: 2
        output-per-million-usd: 10
