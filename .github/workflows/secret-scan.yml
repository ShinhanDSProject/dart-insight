name: secret-scan

# PR에 들어온 커밋에 API 키·비밀번호가 들어 있는지 검사합니다. 모든 PR에서 돕니다.
# 규칙은 저장소 루트의 .gitleaks.toml(기본 규칙 + OpenDART 인증키 규칙)입니다.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 설치 (체크섬 확인)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$file" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: PR 커밋 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

      - name: 비밀정보가 발견됐을 때
        if: failure()
        run: |
          echo "::error::커밋에 키나 비밀번호로 보이는 값이 있습니다. 위 로그에서 파일과 줄을 확인하세요."
          echo "실제 키라면 바로 팀에 알리고 키를 폐기·재발급하세요. 파일을 지우는 커밋만으로는 기록에서 사라지지 않습니다."
          echo "가짜 값인데 걸렸다면 PR에 남기고 .gitleaks.toml 예외를 상의하세요."
