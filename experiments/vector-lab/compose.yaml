name: dart-vector-lab
services:
  lab:
    build: .
    mem_limit: 6g
    cpus: 2
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nlpai-lab/KURE-v1}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-main}
      DATASET: ${DATASET:-/lab/sample.json}
    volumes:
      - vector_data:/data
      - model_cache:/models
      - ./results:/results
      - ./datasets:/datasets:ro
volumes:
  vector_data:
  model_cache:
