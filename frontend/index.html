<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DART Insight</title>
    <script>
      // 화면 테마(FS-16): React보다 먼저 저장된 선택을 적용해 밝은 화면이 잠깐 보이는 것을 막는다.
      // 키·값은 src/shared/lib/theme.ts와 같다. 저장값이 'dark'가 아니면(없음·예전 '시스템' 포함) 밝게다(#856).
      var theme = 'light'
      try {
        if (localStorage.getItem('dart-insight:theme') === 'dark') theme = 'dark'
      } catch (e) {
        // 저장소를 쓸 수 없으면 밝게
      }
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
