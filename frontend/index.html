<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <meta name="theme-color" content="#121638" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DART Insight" />
    <meta property="og:title" content="DART Insight · 전자공시 정기보고서 비교 분석" />
    <meta
      property="og:description"
      content="같은 기업의 DART 정기보고서 두 개를 비교해 바뀐 재무 수치와 문장을 원문 근거와 함께 보여 주는 웹 서비스"
    />
    <meta property="og:image" content="/dart-insight-logo.png" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DART Insight · 전자공시 정기보고서 비교 분석" />
    <meta
      name="twitter:description"
      content="같은 기업의 DART 정기보고서 두 개를 비교해 바뀐 재무 수치와 문장을 원문 근거와 함께 보여 주는 웹 서비스"
    />
    <meta name="twitter:image" content="/dart-insight-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <script>
      // 화면 테마(FS-16): React보다 먼저 저장된 선택을 적용해 밝은 화면이 잠깐 보이는 것을 막는다.
      // 키·값은 src/shared/lib/theme.ts와 같다. 저장값이 'dark'가 아니면(없음·예전 '시스템' 포함) 밝게다(#856).
      var theme = 'light'
      try {
        if (localStorage.getItem('dart-insight:theme') === 'dark') theme = 'dark'
      } catch (e) {
        // 저장소를 쓸 수 없으면 밝게
      }
      document.documentElement.dataset.theme = theme
      // 발표 페이지(easter/three-weeks.html) 마지막 장에서 넘어올 때(#from-deck): 발표 장면이 이미 완성된 첫 화면을 보여 줬으므로
      // 등장 움직임을 건너뛰어 다시 불러오는 것처럼 깜빡이지 않게 한다. 주소의 #from-deck은 지운다.
      // 시간이 아니라 사용자가 처음 조작할 때 원래대로 돌린다(느리게 불러와도 늦게 뜬 카드가 다시 움직이지 않게).
      // 돌릴 때 이미 끝난 움직임은 끝난 상태로 두어, 시간 토큰이 돌아오면서 다시 재생되지 않게 한다.
      if (location.hash === '#from-deck') {
        var root = document.documentElement
        var events = ['pointerdown', 'keydown', 'wheel', 'touchstart']
        var restore = function () {
          events.forEach(function (name) {
            window.removeEventListener(name, restore, true)
          })
          delete root.dataset.intro
          if (typeof document.getAnimations !== 'function') return
          void root.offsetWidth // 시간 토큰이 돌아온 스타일을 먼저 반영한 뒤 끝냄(아니면 짧은 시간 기준으로 끝나 다시 재생됨)
          document.getAnimations().forEach(function (animation) {
            try {
              if (animation.effect && animation.effect.getTiming().iterations !== Infinity) animation.finish()
            } catch (e) {
              // 끝낼 수 없는 움직임은 그대로 둔다
            }
          })
        }
        root.dataset.intro = 'skip'
        // 첫 화면이 준비될 때까지(PageReveal이 data-intro-ready를 붙임) 화면 전체를 가려, 바로 앞 발표 장면이 남아 있게 한다. 늦어도 1.5초에는 보인다
        setTimeout(function () {
          root.dataset.introReady = ''
        }, 1500)
        history.replaceState(null, '', location.pathname + location.search)
        events.forEach(function (name) {
          window.addEventListener(name, restore, true)
        })
      }
    </script>
    <style>
      :root[data-intro='skip']:not([data-intro-ready]) body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
