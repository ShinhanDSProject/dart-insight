<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <title>DART Insight</title>
    <script>
      // 화면 테마(FS-16): React보다 먼저 저장된 선택을 적용해 밝은 화면이 잠깐 보이는 것을 막는다.
      // 키·값은 src/shared/lib/theme.ts와 같다. 저장값이 없으면(시스템) 운영체제 설정을 따른다.
      try {
        var theme = localStorage.getItem('dart-insight:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {
        // 저장소를 쓸 수 없으면 시스템 설정을 따른다
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
