<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DART Insight</title>
    <meta
      name="description"
      content="같은 기업의 DART 정기보고서 두 개를 비교해 바뀐 재무 수치와 문장을 원문 근거와 함께 보여 주는 웹 서비스"
    />
    <meta name="theme-color" content="#121638" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DART Insight" />
    <meta property="og:title" content="DART Insight · 전자공시 정기보고서 비교 분석" />
    <meta
      property="og:description"
      content="같은 기업의 DART 정기보고서 두 개를 비교해 바뀐 재무 수치와 문장을 원문 근거와 함께 보여 주는 웹 서비스"
    />
    <meta property="og:image" content="/dart-insight-logo.png" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DART Insight · 전자공시 정기보고서 비교 분석" />
    <meta
      name="twitter:description"
      content="같은 기업의 DART 정기보고서 두 개를 비교해 바뀐 재무 수치와 문장을 원문 근거와 함께 보여 주는 웹 서비스"
    />
    <meta name="twitter:image" content="/dart-insight-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <script>
      // 화면 테마(FS-16): React보다 먼저 저장된 선택을 적용해 밝은 화면이 잠깐 보이는 것을 막는다.
      // 키·값은 src/shared/lib/theme.ts와 같다. 저장값이 'dark'가 아니면(없음·예전 '시스템' 포함) 밝게다(#856).
      var theme = 'light'
      try {
        if (localStorage.getItem('dart-insight:theme') === 'dark') theme = 'dark'
      } catch (e) {
        // 저장소를 쓸 수 없으면 밝게
      }
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
