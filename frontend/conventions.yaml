# frontend 코드 컨벤션. 판단이 필요한 규칙만 적는다(형식은 ESLint·tsc가 검사).
# 규칙을 어기면 리뷰에서 ID로 부른다(예: "ST-2"). 바꿀 때는 이 파일과 린트 설정을 같은 PR에서 고친다.
v: 1
scope: frontend/src
enforced: [eslint, "tsc --noEmit(strict)"]
see: {api: docs/api-spec.md, design: frontend/design-system.md, figma: "Figma 신한 2차 프로젝트 › 디자인"}

dir:  # src/ 아래
  DIR-1: "app/: 라우터·레이아웃·오류 화면. shared/: 기능을 모르는 공통 코드. features/<기능>/: 화면 하나의 흐름"
  DIR-2: "shared/ 하위: api(client·endpoints), ui(디자인 시스템), hooks, lib(순수 함수), styles(tokens·global)"
  DIR-3: "features/<기능>/ 하위: <Name>Page.tsx, components/, hooks/, model/(타입·reducer·순수 함수), api.ts, <기능>.css"
  DIR-4: features끼리 직접 import하지 않는다. 둘 이상이 쓰면 shared로 올린다(api 타입 포함)
  DIR-5: 테스트는 대상 옆에 *.test.ts. 순수 함수(model·lib)는 테스트를 같이 쓴다

ui:  # 디자인 시스템
  UI-1: 버튼·배지·안내·탭·세그먼트·카드·표는 shared/ui 컴포넌트를 쓴다. 같은 모양을 화면에서 새로 만들지 않는다
  UI-2: 색·모서리·간격·글꼴은 styles/tokens.css 토큰만 쓴다. 값을 직접 적지 않는다
  UI-3: 새 공통 모양이 필요하면 Figma에 먼저 있는지 보고 shared/ui에 variant로 더한다
  UI-4: 클릭되는 것은 <button>·<a>. div에 onClick 금지. 아이콘만 있는 버튼은 aria-label
  UI-5: 증감은 색만으로 구분하지 않는다(▲▼·부호 함께). 증감 칸은 중립색 [design-system.md 3-3]

state:
  ST-1: 화면 상태는 판별 유니온({status:'idle'|'loading'|'success'|'error'})으로 표현한다. boolean 여러 개로 만들지 않는다
  ST-2: 상태가 둘 이상 함께 바뀌면 useReducer. reducer·action 타입은 model/에 두고 순수 함수로 테스트한다
  ST-3: 유니온 분기는 ts-pattern match(...).exhaustive(). 렌더링 분기도 같다. if·삼항을 겹쳐 쓰지 않는다
  ST-4: 데이터 불러오기·폴링·URL 쿼리 상태는 커스텀 훅(use<무엇>)으로 뺀다. 컴포넌트에 useEffect+fetch를 직접 쓰지 않는다
  ST-5: 비동기 훅은 언마운트·재요청 때 AbortController로 이전 요청을 취소한다
  ST-6: URL로 공유되어야 하는 상태(탭·비교 기준·선택한 보고서)는 searchParams에 둔다. 그 밖은 컴포넌트 상태
  ST-7: 전역 상태 라이브러리는 쓰지 않는다(필요해지면 ADR)

api:
  API-1: 경로는 shared/api/endpoints.ts에만. 호출은 client의 apiGet·apiPost·apiPut·apiDelete만 쓴다(fetch 직접 금지)
  API-2: 응답 타입은 docs/api-spec.md와 같은 이름·필드. null은 null로 두고 0·빈 문자열로 바꾸지 않는다
  API-3: "에러는 ApiError.code로 분기한다(match). message 문자열로 분기하지 않는다"

name:
  NM-1: 컴포넌트·타입 PascalCase, 훅 use 접두사, reducer는 <대상>Reducer, action type은 'set-tab'처럼 kebab-case 문자열
  NM-2: 화면 문구는 한국어 존댓말 해요체. 숫자 표시는 lib의 format 함수로만 만든다
  NM-3: export는 named만. default export는 쓰지 않는다

test:
  T-1: model·lib·reducer·훅의 분기는 vitest로 확인한다. 화면은 실제 브라우저로 확인하고 PR에 적는다
  T-2: 테스트 이름은 한국어 문장으로 동작을 적는다
