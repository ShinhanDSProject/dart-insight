# 하루 한도(ADR-0054)는 backend가 X-Forwarded-For의 첫 주소로 셉니다. 클라이언트가 보낸 값을 그대로 넘기면
# 주소를 지어내 한도를 피할 수 있으므로, Cloudflare를 거친 요청은 Cloudflare가 적어 주는 실제 접속 주소
# (CF-Connecting-IP)로 덮어씁니다. 그 헤더가 없는 요청(로컬·직접 접속)은 지금까지처럼 받은 값을 그대로 넘깁니다.
map $http_cf_connecting_ip $forwarded_for {
    ""      $http_x_forwarded_for;
    default $http_cf_connecting_ip;
}

server {
    chunked_transfer_encoding off;
    listen 80;
    server_name dart-insight.shinhanacademy.co.kr;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api/|oauth2/authorization/|login/oauth2/code/) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;

        # 외부 HTTPS 443 → VM HTTP 80이라는 현재 배포 조건에 맞춘 값
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 240s;
    }

    # 파일 이름에 내용 해시가 붙는 빌드 산출물: 내용이 바뀌면 이름도 바뀌므로 오래 캐시한다.
    # 없는 파일은 화면(index.html) 대신 404로 답해, 배포 뒤 옛 화면이 찾는 조각을 HTML로 잘못 받지 않게 한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 화면 진입 파일과 발표 페이지(easter/)는 이름이 그대로라, 배포하면 바로 새 것이 보이도록 매번 서버에 확인한다
    # (바뀌지 않았으면 304)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /easter/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
