name: dart-ci

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1536m"
    mem_limit: 2g
    cpus: 1.0
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
