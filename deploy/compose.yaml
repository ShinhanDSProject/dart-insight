name: dart-insight

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dart_insight
      MARIADB_USER: dart
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_ROOT_HOST: localhost
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?required}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?required}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:?required}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:?required}"
      NAVER_CLIENT_ID: "${NAVER_CLIENT_ID:?required}"
      NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET:?required}"
      NAVER_SEARCH_CLIENT_ID: "${NAVER_SEARCH_CLIENT_ID:?required}"
      NAVER_SEARCH_CLIENT_SECRET: "${NAVER_SEARCH_CLIENT_SECRET:?required}"
      MAIL_HOST: "${MAIL_HOST:?required}"
      MAIL_PORT: "${MAIL_PORT:?required}"
      MAIL_USERNAME: "${MAIL_USERNAME:?required}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?required}"
      MAIL_FROM: "${MAIL_FROM:?required}"
      PASSWORD_RESET_PAGE_URL: "${PASSWORD_RESET_PAGE_URL:?required}"
      PASSWORD_RESET_LOG_LINK: "${PASSWORD_RESET_LOG_LINK:?required}"
      DB_URL: jdbc:mariadb://db:3306/dart_insight
      DB_USERNAME: dart
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      OPENDART_API_KEY: ${OPENDART_API_KEY:?OPENDART_API_KEY is required}
      AI_SERVER_URL: "${AI_SERVER_URL:?AI_SERVER_URL is required}"
      AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}"
      CORS_ALLOWED_ORIGINS: https://dart-insight.shinhanacademy.co.kr
      DOCUMENT_CACHE_DIR: /app/data/documents
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SECURE_COOKIE: "true"
      SOCIAL_LOGIN_REDIRECT_URL: https://dart-insight.shinhanacademy.co.kr/login
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - document_cache:/app/data/documents
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  document_cache:
