[project]
name = "dart-insight-ai"
version = "0.1.0"
description = "공시레이더 AI 서버: OpenDART 수집, 원문 파싱, LLM 분석"
authors = [
    { name = "전민욱", email = "mwzzang00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
